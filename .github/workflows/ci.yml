---
name: ci

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit (fmt + clippy + test + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        # Los tests de modos fallan si no hay io_uring con MSG_RING.
        run: cargo test --release
      - name: smoke del benchmark (no es la medición)
        # Falla si io_uring o MSG_RING no están disponibles.
        run: cargo run --release --bin msgring-bench -- smoke

  asan:
    name: asan (nightly, build-std)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: test bajo AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
        run: >-
          cargo test -Zbuild-std --target x86_64-unknown-linux-gnu
          --target-dir target/asan --tests
